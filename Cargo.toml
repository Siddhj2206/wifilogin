[package]
name = "wifilogin"
version = "0.1.0"
edition = "2024"
description = "Efficient auto-login for college captive portal — event-driven via NetworkManager D-Bus, only on target SSIDs"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
zbus = { version = "5", features = ["tokio"] }
zvariant = "5"
serde = { version = "1", features = ["derive"] }
toml = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "cookies", "form"] }
keyring = "4"
anyhow = "1"
thiserror = "2"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
humantime = "2"
notify = "6"
serde_json = "1.0.151"

[profile.release]
opt-level = "z"  # Optimize for size ("s" is an alternative, test both)
lto = true       # Enable Link-Time Optimization
codegen-units = 1 # Reduce parallel code generation units to increase optimization potential
panic = "abort"  # Abort on panic to remove unwinding code
strip = true     # Strip symbols from the binary (requires Rust 1.59+)
